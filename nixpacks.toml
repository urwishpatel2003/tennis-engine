# Nixpacks build customisation.
#
# The data is built AT BUILD TIME, not committed and not seeded from a volume.
#
# Why: the machine this project is developed on sits behind a proxy that 404s
# raw.githubusercontent.com, so the real Sackmann archive cannot be fetched
# locally. Railway's build container has unrestricted internet, so the build is
# the natural place to pull it. The image therefore ships with real ATP/WTA data
# and every redeploy refreshes it, which is also why there is no Railway Volume
# here — unlike the NFL engine, nothing on this server mutates data at runtime,
# so there is no state worth persisting across deploys.
#
# FETCH_SEASONS controls the range (Railway service variable). More history means
# better-converged Elo and a longer build. Match data exists back to 1968 and
# serve/return stats from ~1991, so there is a lot to reach for — but a hosted
# build has a time limit, and the first attempt at 2005-2026 was killed mid-fetch.
# Start narrow, confirm the deploy is green, then widen the variable.
#
# `python -u` is not optional here. Without it Python block-buffers stdout when
# stdout is not a TTY, so a 10-minute fetch-and-build emits nothing until it
# finishes and the Railway build log looks hung — you cannot tell a slow download
# from a stuck one.
[phases.build]
dependsOn = ["install"]
cmds = [
  # TEMPORARY. Discovers the Live Tennis API's real response shapes so
  # engine/live_tennis.py can be written against them instead of a guess. It
  # has to run here because the development machine's corporate proxy blocks
  # api.livetennisapi.com outright (Zscaler serves its own 403 before the
  # request leaves the network), while this container has open internet.
  #
  # Read the output with `railway logs --build`. No-ops when the key is unset,
  # never fails the build, and never prints the key. Remove once the parser is
  # written and verified.
  "python -u tools/probe_live_tennis.py || true",
  "python -u fetch_data.py --seasons ${FETCH_SEASONS:-2010-2026} --skip-rankings",
  # The Sackmann mirror stopped updating, so extend the ATP archive with recent
  # results before building. Without this the image ships months behind and every
  # model price on the Today tab is stale on arrival. --no-rebuild because
  # run_engine builds on the next line anyway.
  "python -u -m engine.refresh --no-rebuild --no-wta-stats || echo '  (refresh skipped - building on base archive)'",
  # Winners / unforced errors / net points. ~11s for 2021-2026 — a bulk CSV read
  # per season, nothing like the per-match WTA stats call that broke the build
  # deadline twice. Display only; measured as no help to the model.
  "python -u tools/backfill_rally_stats.py --from 2021 || echo '  (rally backfill skipped)'",
  "python -u run_engine.py --build",
  "python -u tools/build_report.py",
]
