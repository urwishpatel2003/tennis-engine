<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tennis Engine</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a323d;
    --ink:#e6edf3; --dim:#8b949e; --accent:#4fc3a1; --accent2:#e0a458;
    --a:#4fc3a1; --b:#e06c75; --clay:#c96f3f; --grass:#4a8f5a; --hard:#3f7fc9;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f8fa; --panel:#fff; --panel2:#eef2f6; --line:#d5dde5;
           --ink:#111820; --dim:#5b6875; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent);text-decoration:none}
  header{display:flex;align-items:center;gap:22px;padding:14px 22px;
         background:var(--panel);border-bottom:1px solid var(--line);
         position:sticky;top:0;z-index:20;flex-wrap:wrap}
  .brand{font-weight:700;font-size:16px;letter-spacing:.2px}
  .brand span{color:var(--accent)}
  nav a{padding:6px 12px;border-radius:7px;color:var(--dim);font-weight:500}
  nav a.on{background:var(--panel2);color:var(--ink)}
  .warn{margin-left:auto;background:#3d2b14;color:var(--accent2);
        padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600}
  main{max-width:1180px;margin:0 auto;padding:22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;
        padding:18px;margin-bottom:18px}
  h2{margin:0 0 14px;font-size:16px;font-weight:650}
  h3{margin:18px 0 9px;font-size:13px;font-weight:650;color:var(--dim);
     text-transform:uppercase;letter-spacing:.6px}
  .row{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px;
        text-transform:uppercase;letter-spacing:.5px}
  select,input,button{background:var(--panel2);color:var(--ink);
        border:1px solid var(--line);border-radius:7px;padding:8px 11px;font:inherit}
  button{cursor:pointer;font-weight:600}
  button.primary{background:var(--accent);color:#06221a;border-color:transparent}
  /* Adding to a position you already hold is a deliberate, secondary act,
     so it must not look like the primary call to action. */
  button.ghost{background:transparent;color:var(--dim);font-weight:500;
               font-size:.85em;padding:2px 8px}
  button:hover{filter:brightness(1.12)}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;
     font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
  th:first-child,td:first-child,th.l,td.l{text-align:left}
  tbody tr:hover{background:var(--panel2)}
  tbody tr.click{cursor:pointer}
  .pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;
        font-weight:600}
  .Clay{background:rgba(201,111,63,.2);color:var(--clay)}
  .Grass{background:rgba(74,143,90,.2);color:var(--grass)}
  .Hard{background:rgba(63,127,201,.2);color:var(--hard)}
  .Carpet{background:rgba(140,120,190,.2);color:#8c78be}
  .up{color:var(--a)} .down{color:var(--b)} .dim{color:var(--dim)}
  .bigbar{display:flex;height:38px;border-radius:8px;overflow:hidden;margin:6px 0 4px}
  .bigbar div{display:flex;align-items:center;justify-content:center;
              font-weight:700;font-size:14px;color:#08130f}
  .ba{background:var(--a)} .bb{background:var(--b)}
  .names{display:flex;justify-content:space-between;font-weight:650;margin-bottom:3px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:11px}
  .stat{background:var(--panel2);border-radius:9px;padding:11px 13px}
  .stat .k{font-size:11px;color:var(--dim);text-transform:uppercase;
           letter-spacing:.5px;margin-bottom:3px}
  .stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .s{font-size:11px;color:var(--dim)}
  .bars div{display:flex;align-items:center;gap:9px;margin:3px 0;font-size:12px}
  .bars .lab{width:62px;text-align:right;color:var(--dim);
             font-variant-numeric:tabular-nums}
  .bars .track{flex:1;height:15px;background:var(--panel2);border-radius:4px;
               overflow:hidden}
  .bars .fill{height:100%;border-radius:4px}
  .bars .val{width:52px;font-variant-numeric:tabular-nums;color:var(--dim)}
  .ac{position:relative}
  .acmenu{position:absolute;top:100%;left:0;right:0;background:var(--panel);
          border:1px solid var(--line);border-radius:8px;margin-top:3px;z-index:30;
          max-height:250px;overflow:auto;display:none}
  .acmenu div{padding:8px 11px;cursor:pointer}
  .acmenu div:hover,.acmenu div.sel{background:var(--panel2)}
  .muted{color:var(--dim);font-size:12px}
  .err{background:rgba(224,108,117,.13);border:1px solid rgba(224,108,117,.35);
       color:var(--b);padding:11px 13px;border-radius:8px}
  svg{display:block;max-width:100%}
  .scroll{overflow-x:auto}
  .note{font-size:12px;color:var(--dim);border-left:3px solid var(--line);
        padding-left:11px;margin-top:12px}

  /* Typographic hierarchy. Everything was the same weight, so nothing read as
     more important than anything else. Three levels, and no more: the thing a
     row is ABOUT, the numbers that decide something, and the supporting detail
     that should recede. Bold everywhere is the same as bold nowhere. */
  .key{font-weight:650}                       /* what the row is about */
  .sub{display:block;font-size:11px;color:var(--dim);font-weight:400;
       font-variant-numeric:tabular-nums}     /* the identifier under it */
  .fig,td.fig{font-weight:650}                /* a number that decides something */
  td.lead{font-weight:700;font-size:15px}     /* the P/L column */
  .tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10px;
       font-weight:700;letter-spacing:.4px;background:var(--panel2);
       color:var(--dim);text-transform:uppercase}
  .stat.hero .v{font-size:24px}
  .stat.hero{background:var(--panel2);border:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <div class="brand">TENNIS <span>ENGINE</span></div>
  <nav>
    <a href="#/live" data-r="live">Live</a>
    <a href="#/today" data-r="today">Today</a>
    <a href="#/rankings" data-r="rankings">Rankings</a>
    <a href="#/tournaments" data-r="tournaments">Tournaments</a>
    <a href="#/matchup"  data-r="matchup">Matchup</a>
    <a href="#/player"   data-r="player">Player</a>
    <a href="#/model"    data-r="model">Model</a>
    <a href="#/kalshi"   data-r="kalshi">Kalshi</a>
  </nav>
  <div id="warn"></div>
</header>
<main id="view"></main>

<script>
const $ = s => document.querySelector(s);
const api = (p,q={}) => fetch(p+'?'+new URLSearchParams(q)).then(r=>r.json());
const pct = (v,d=1) => v==null?'—':(v*100).toFixed(d)+'%';
const num = (v,d=0) => v==null?'—':(+v).toFixed(d);
const surf = s => `<span class="pill ${s}">${s}</span>`;
/* Times arrive as ISO UTC. They were rendered by slicing the string, which
   showed UTC to everyone: a 00:30Z match displayed as tomorrow even though it
   starts this evening in CST. Anything shown to a person goes through here. */
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'local';
const TZLABEL = (() => { try {
    return new Intl.DateTimeFormat(undefined,{timeZoneName:'short'})
      .formatToParts(new Date()).find(x=>x.type==='timeZoneName')?.value || TZ;
  } catch(e){ return TZ; } })();
const localTime = iso => { const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleString(undefined,
    {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false}); };
const localDay = iso => { const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString('en-CA'); };   // YYYY-MM-DD, local
let META = {tours:['atp'],surfaces:['overall']};

/* ─── routing ─────────────────────────────────────────────────────────────── */
const ROUTES = {live:viewLive, today:viewToday, rankings:viewRankings,
                tournaments:viewTournaments, matchup:viewMatchup,
                player:viewPlayer, model:viewModel, kalshi:viewKalshi};
function route(){
  clearInterval(KAL_TIMER);      // stop polling Kalshi when leaving that page
  const [,name,arg] = (location.hash||'#/today').split('/');
  const r = ROUTES[name] ? name : 'today';
  document.querySelectorAll('nav a').forEach(a=>
    a.classList.toggle('on', a.dataset.r===r));
  ROUTES[r](arg);
}
addEventListener('hashchange', route);

/* ─── autocomplete ────────────────────────────────────────────────────────── */
function autocomplete(input, tourFn, onPick){
  const menu = document.createElement('div');
  menu.className = 'acmenu';
  input.parentNode.appendChild(menu);
  let items = [], sel = -1, timer;

  const close = () => { menu.style.display='none'; sel=-1; };
  const render = () => {
    menu.innerHTML = items.map((it,i)=>
      `<div class="${i===sel?'sel':''}" data-i="${i}">${it.name}
       <span class="muted">${it.ioc||''} · ${it.matches} matches</span></div>`).join('');
    menu.style.display = items.length ? 'block' : 'none';
  };
  const pick = i => {
    if(!items[i]) return;
    input.value = items[i].name;
    input.dataset.pid = items[i].id;
    close();
    onPick && onPick(items[i]);
  };

  input.addEventListener('input', ()=>{
    clearTimeout(timer);
    input.dataset.pid = '';
    const q = input.value.trim();
    if(q.length<2){ items=[]; close(); return; }
    timer = setTimeout(async ()=>{
      items = await api('/api/search',{q, tour:tourFn()});
      sel = -1; render();
    }, 160);
  });
  input.addEventListener('keydown', e=>{
    if(menu.style.display==='none') return;
    if(e.key==='ArrowDown'){ sel=Math.min(sel+1,items.length-1); render(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ sel=Math.max(sel-1,0); render(); e.preventDefault(); }
    else if(e.key==='Enter'){ if(sel>=0){ pick(sel); e.preventDefault(); } }
    else if(e.key==='Escape'){ close(); }
  });
  menu.addEventListener('mousedown', e=>{
    const d = e.target.closest('[data-i]'); if(d) pick(+d.dataset.i);
  });
  input.addEventListener('blur', ()=>setTimeout(close,180));
}

/* ─── sortable table ──────────────────────────────────────────────────────── */
function sortable(table){
  table.querySelectorAll('th[data-k]').forEach(th=>{
    th.onclick = () => {
      const k = th.dataset.k, body = table.tBodies[0];
      const dir = th.dataset.dir === 'asc' ? -1 : 1;
      table.querySelectorAll('th').forEach(x=>x.removeAttribute('data-dir'));
      th.dataset.dir = dir === 1 ? 'asc' : 'desc';
      [...body.rows]
        .sort((x,y)=>{
          const a=x.dataset[k], b=y.dataset[k];
          const na=parseFloat(a), nb=parseFloat(b);
          if(!isNaN(na)&&!isNaN(nb)) return (na-nb)*dir;
          return String(a).localeCompare(String(b))*dir;
        })
        .forEach(r=>body.appendChild(r));
    };
  });
}

/* ─── RANKINGS ────────────────────────────────────────────────────────────── */
async function viewRankings(){
  const st = JSON.parse(localStorage.getItem('rk')||'{}');
  $('#view').innerHTML = `
   <div class="card">
    <h2>Power rankings</h2>
    <div class="row">
      <div><label>Tour</label><select id="tour">${
        META.tours.map(t=>`<option ${st.tour===t?'selected':''}>${t.toUpperCase()}</option>`).join('')}</select></div>
      <div><label>Surface</label><select id="surface">${
        META.surfaces.map(s=>`<option ${st.surface===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div><label>Min matches</label><input id="mm" type="number" value="${st.mm||20}" style="width:88px"></div>
      <button class="primary" id="go">Update</button>
    </div>
    <p class="muted">Model strength, not the official ATP/WTA list — those are a
      52-week points tally. Click a row for the player profile.</p>
    <div id="out" class="scroll"><p class="muted">Loading…</p></div>
   </div>`;

  const load = async () => {
    const tour = $('#tour').value.toLowerCase(), surface = $('#surface').value,
          mm = $('#mm').value;
    localStorage.setItem('rk', JSON.stringify({tour,surface,mm}));
    $('#out').innerHTML = '<p class="muted">Loading…</p>';
    const d = await api('/api/rankings',{tour, surface, min_matches:mm, limit:150});
    if(d.error || !d.length){ $('#out').innerHTML =
      `<div class="err">${d.error||'No players met the minimum.'}</div>`; return; }
    $('#out').innerHTML = `<table id="t">
      <thead><tr>
        <th data-k="rank">#</th><th class="l" data-k="name">Player</th>
        <th data-k="elo">Elo</th><th data-k="selo">Surface</th>
        <th data-k="hold">Hold%</th><th data-k="brk">Break%</th>
        <th data-k="form">Form 90d</th><th data-k="trend">Trend</th>
        <th data-k="m">Matches</th>
      </tr></thead><tbody>${d.map(r=>`
        <tr class="click" data-id="${r.player_id}" data-rank="${r.rank}"
            data-name="${r.name}" data-elo="${r.elo_overall}"
            data-selo="${r.elo_surface}" data-hold="${r.hold_pct}"
            data-brk="${r.break_pct}" data-form="${r.form_90d??-1}"
            data-trend="${r.trend??0}" data-m="${r.matches_overall}">
          <td>${r.rank}</td>
          <td class="l">${r.name??r.player_id} <span class="muted">${r.ioc||''}</span></td>
          <td>${num(r.elo_overall)}</td><td>${num(r.elo_surface)}</td>
          <td>${pct(r.hold_pct)}</td><td>${pct(r.break_pct)}</td>
          <td>${pct(r.form_90d,0)}</td>
          <td class="${r.trend>0?'up':r.trend<0?'down':''}">${
            r.trend==null?'—':(r.trend>0?'+':'')+num(r.trend)}</td>
          <td>${r.matches_overall}</td>
        </tr>`).join('')}</tbody></table>`;
    sortable($('#t'));
    $('#t').onclick = e => {
      const tr = e.target.closest('tr[data-id]');
      if(tr) location.hash = `#/player/${tour}:${tr.dataset.id}`;
    };
  };
  $('#go').onclick = load;
  load();
}



/* ─── TODAY (live fixtures + odds) ────────────────────────────────────────── */
/* ─── live ────────────────────────────────────────────────────────────────── */
/* Win probability recomputed from the CURRENT score by the same Barnett-Clarke
   chain that prices a match before it starts (engine/live_state.py), so the
   live figure and the pre-match price can never disagree.

   Measured on 8,000 replayed matches: knowing one completed set moves accuracy
   from 65% to 80%, and the number stays calibrated to within ~5pp at every
   stage. The `swing` column is the whole point of the panel - it is the match
   story so far, in one number.

   Polling is deliberately gentle. The free API tier allows 100 requests a day
   and the server caches, so a hard refresh here costs a real request. */
async function viewLive(){
  $('#view').innerHTML = `
   <div class="card">
    <h2>Live matches <span class="muted" style="font-weight:400">— win probability from the current score</span></h2>
    <div class="row">
      <div><label>Tour</label><select id="ltour">
        <option value="">ATP + WTA</option>
        <option value="atp">ATP only</option>
        <option value="wta">WTA only</option></select></div>
      <div><label>Auto-refresh</label><select id="lauto">
        <option value="0">Off</option>
        <option value="60">Every 60s</option>
        <option value="180" selected>Every 3 min</option></select></div>
      <button id="lreload">Refresh now</button>
    </div>
    <div id="lout"><p class="muted">Loading live matches…</p></div>
   </div>`;

  let timer = null;

  function bar(p, a, b, swing, prematch){
    const wa = Math.max(2, Math.min(98, p*100));
    const sw = swing>=0 ? 'up' : 'down';
    // `prematch` is passed in rather than derived. An earlier version wrote
    // 1-swing-p+swing, which is just 1-p - the OPPONENT's live number, labelled
    // as the pre-match one. It looked entirely plausible on screen.
    return `
      <div class="names"><span>${a}</span><span>${b}</span></div>
      <div class="bigbar"><div class="ba" style="width:${wa}%">${pct(p)}</div>
        <div class="bb" style="width:${100-wa}%">${pct(1-p)}</div></div>
      <div class="names muted"><span class="${sw}">${swing>=0?'+':''}${(swing*100).toFixed(1)} pts vs pre-match</span>
        <span>was ${pct(prematch)} before a ball was struck</span></div>`;
  }

  function render(d){
    if(d.available === false){
      $('#lout').innerHTML = `<div class="err">Live matches unavailable — ${d.reason||'unknown'}</div>
        <p class="muted" style="margin-top:10px">Set <code>LIVE_TENNIS_API_KEY</code> on the
        service to enable this view. The provider's free tier is sufficient.</p>`;
      return;
    }
    const rows = d.matches || [];
    if(!rows.length){
      $('#lout').innerHTML = `<p class="muted">No matches in progress right now.</p>`;
      return;
    }
    const m = d.meta || {};
    const age = m.cache_age_seconds==null ? '' :
      ` · data ${Math.round(m.cache_age_seconds)}s old (cached ${m.ttl_seconds}s)`;
    $('#lout').innerHTML =
      `<p class="muted">${rows.length} match${rows.length>1?'es':''} in progress${age}
        · sorted by how much the next point matters</p>` +
      rows.map(r => {
        const srv = r.a_serving ? r.player_a : r.player_b;
        const stale = r.stale ? ` <span class="down">· feed stale</span>` : '';
        return `
        <div class="card" style="margin-top:12px;cursor:pointer"
             onclick="location.hash='#/matchup/'+[r.tour,r.player_a,r.player_b,r.surface,r.best_of,r.tournament||''].map(encodeURIComponent).join('|')">
          <div class="muted" style="margin-bottom:6px">
            ${surf(r.surface)} ${r.tournament||''} · ${r.round||''} · best of ${r.best_of}
            · serving: ${srv}${stale}
          </div>
          ${bar(r.live_a, r.player_a, r.player_b, r.swing_a, r.prematch_a)}
          <div class="grid" style="margin-top:12px">
            <div class="stat"><div class="k">Score</div>
              <div class="v">${r.scoreline||'—'}</div>
              <div class="s">${r.in_tiebreak?'tiebreak':'points '+(r.points||[]).join('-')}</div></div>
            <div class="stat" title="How much win probability the next point is worth. A point at 30-0 in a 5-1 set is worth almost nothing; break point in a decider can be worth twenty points.">
              <div class="k">Next point worth</div>
              <div class="v">${(r.leverage*100).toFixed(1)}</div>
              <div class="s">points of win prob</div></div>
            <div class="stat"><div class="k">Pre-match</div>
              <div class="v">${pct(r.prematch_a)}</div>
              <div class="s">${r.player_a.split(' ').pop()}</div></div>
            <div class="stat"><div class="k">Data quality</div>
              <div class="v">${r.data_quality}</div>
              <div class="s">rating inputs</div></div>
          </div>
        </div>`;
      }).join('');
  }

  /* `force` sends refresh=1, which bypasses the server's cache. Without it the
     button was silently a no-op: the cached payload came straight back, the page
     re-rendered identical content, and it looked broken. The button also states
     what it is doing - an auto-refresh must not flash the panel, but a click
     with no visible response is indistinguishable from a dead control. */
  async function load(force){
    const btn = $('#lreload');
    if(force){ btn.disabled = true; btn.textContent = 'Refreshing…'; }
    try {
      const q = $('#ltour').value ? {tour: $('#ltour').value} : {};
      if(force) q.refresh = '1';
      render(await api('/api/live', q));
    }
    catch(e){ $('#lout').innerHTML = `<div class="err">${e}</div>`; }
    finally { if(force){ btn.disabled = false; btn.textContent = 'Refresh now'; } }
  }
  function schedule(){
    if(timer) clearInterval(timer);
    const secs = +$('#lauto').value;
    if(secs > 0) timer = setInterval(() => load(false), secs*1000);
  }
  $('#lreload').onclick = () => load(true);
  $('#ltour').onchange = () => load(false);
  $('#lauto').onchange = schedule;
  schedule();
  load(false);
}

/* The record is deliberately forward-only. The odds provider keeps no price
   history, so a backfilled P/L would pair today's ratings with prices nobody
   was offered - hindsight dressed as evidence. It starts empty and fills. */
async function loadRecord(){
if(!$('#rec')) return;   // only the Today view has this panel
  let d;
  try { d = await api('/api/track_record'); }
  catch(e){ $('#rec').innerHTML = `<div class="err">${e}</div>`; return; }
  if(d.error){ $('#rec').innerHTML = `<div class="err">${d.error}</div>`; return; }

  const warn = d.persistent ? '' : `<div class="err" style="margin-bottom:12px">
    <strong>This record resets on every deploy.</strong> It is being written inside
    the container image, which is rebuilt each time the service is deployed. Set
    <code>BET_LOG_PATH</code> to a mounted Railway Volume to keep it.</div>`;

  if(!d.settled){
    $('#rec').innerHTML = warn + `<p class="muted">${d.logged||0} bet(s) logged,
      none settled yet. A bet settles once the result reaches the archive, which
      for the ATP can lag a couple of days behind the match.</p>`;
    return;
  }
  const pl = d.pl_units, cls = pl>0?'up':(pl<0?'down':'');
  const note = d.meaningful
    ? `<p class="note">Sample is large enough to read.</p>`
    : `<p class="note"><strong>Too few bets to mean anything yet.</strong>
       ${d.settled} settled; a run needs about ${d.meaningful_after} before profit or
       loss can be told apart from chance. At a typical 5% margin the swing on 100
       flat bets is around ±10 units on its own. Expect this to drift negative:
       out of sample this model does not beat tennis markets.</p>`;

  $('#rec').innerHTML = warn + `
    <div class="grid">
      <div class="stat"><div class="k">Profit / loss</div>
        <div class="v ${cls}">${pl>0?'+':''}${num(pl,2)}u</div>
        <div class="s">flat, 1 unit a bet</div></div>
      <div class="stat"><div class="k">Record</div>
        <div class="v">${d.won}–${d.lost}</div>
        <div class="s">${d.settled} settled · ${d.open} open</div></div>
      <div class="stat"><div class="k">ROI</div>
        <div class="v ${cls}">${d.roi_pct==null?'—':(d.roi_pct>0?'+':'')+d.roi_pct+'%'}</div>
        <div class="s">per unit staked</div></div>
      <div class="stat"><div class="k">Sized as suggested</div>
        <div class="v ${d.pl_kelly_units>0?'up':(d.pl_kelly_units<0?'down':'')}">${
          d.pl_kelly_units>0?'+':''}${num(d.pl_kelly_units,3)}u</div>
        <div class="s">quarter Kelly</div></div>
      <div class="stat"><div class="k">Average price</div>
        <div class="v">${d.avg_odds==null?'—':num(d.avg_odds,2)}</div>
        <div class="s">decimal</div></div>
    </div>
    ${note}
    <div class="scroll"><table><thead><tr>
      <th class="l">Logged</th><th class="l">Match</th><th class="l">Backed</th>
      <th>Odds</th><th class="l">Result</th><th>P/L</th>
    </tr></thead><tbody>
    ${(d.recent||[]).map(r=>`<tr>
      <td class="l dim">${String(r.logged_at||'').slice(0,10)}</td>
      <td class="l">${r.player_a} v ${r.player_b}</td>
      <td class="l">${r.player||''}</td>
      <td>${num(r.odds,2)}</td>
      <td class="l ${r.settled?(r.won?'up':'down'):'dim'}">${
        r.settled?(r.won?'won':'lost'):'open'}</td>
      <td class="${r.settled?(r.pl_units>0?'up':'down'):''}">${

}

/* Kalshi tickets. Building a ticket costs nothing; placing an order is a
   separate, explicitly confirmed act. Nothing here fires on load, on a timer,
   or in a loop - each order needs its own click and its own confirmation. */
/* Today's fixtures only, unless asked otherwise. A hidden pick is the kind of
   thing that reads as a bug, so the count of what is hidden is always shown and
   the switch back is one click. */
let KAL_TODAY_ONLY = true;
let KAL_TIMER = null;

/* Reload the tickets and the account together, and SAY so while it happens.
   These are two round trips to Kalshi and can take a few seconds. */
async function refreshKalshi(why){
  const note = $('#kalstatus');
  if(note) note.textContent = `Updating ${why ? why : ''}…`;
  try {
    await Promise.all([loadKalshi(), loadKalshiReport($('#kscope')?.value)]);
    const n = $('#kalstatus');
    if(n) n.textContent = `Updated ${new Date().toLocaleTimeString(undefined,
      {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false})}`;
  } catch(e){
    const n = $('#kalstatus');
    if(n) n.textContent = `Update failed: ${e}`;
  }
}

function wireKalToggle(){
  const a = $('#kaltoggle');
  if(a) a.onclick = e => { e.preventDefault();
    KAL_TODAY_ONLY = !KAL_TODAY_ONLY; loadKalshi(); };
}

async function loadKalshi(){
  if(!$('#kal')) return;
  let d;
  try { d = await api('/api/kalshi/tickets'); }
  catch(e){ $('#kal').innerHTML = `<div class="err">${e}</div>`; return; }
  if(d.available === false){
    $('#kal').innerHTML = `<p class="muted">Tickets unavailable — ${d.reason||'unknown'}</p>`;
    return;
  }
  const b = d.budget || {};
  const mode = d.live
    ? `<span class="down"><strong>LIVE — real money</strong></span>`
    : `<span class="dim">demo environment</span>`;
  const arm = d.armed
    ? `<span class="down">armed: a confirmed ticket WILL be sent</span>`
    : `<span class="dim">dry run: confirming logs the order and sends nothing</span>`;
  const head = `<p class="muted">${mode} · ${arm}<br>
     bankroll $${num(b.bankroll,2)} · committed today $${num(b.committed,2)} of
     $${num(b.daily_cap,2)} · remaining $${num(b.daily_remaining,2)}</p>`;

  /* Today only, by default. "Today" is the VIEWER's day, not the server's: the
     server runs in UTC, so a 00:30Z match is tomorrow to it and this evening to
     you. Filtering here is the only place the right timezone is known.

     A fixture with no start time is kept rather than dropped — an unknown time
     is not evidence that it is not today, and silently hiding a bet is worse
     than showing one too many. */
  const all = d.tickets || [];
  const today = localDay(new Date().toISOString());
  const rows = KAL_TODAY_ONLY
    ? all.filter(t => !t.starts || localDay(t.starts) === today)
    : all;
  const laterCount = all.length - rows.length;
  const toggle = `<p class="muted">${KAL_TODAY_ONLY
      ? `Showing <b>today only</b> (${TZLABEL})${laterCount
          ? ` — ${laterCount} later fixture(s) hidden` : ''}.`
      : `Showing <b>all upcoming</b> fixtures.`}
    <a href="#" id="kaltoggle">${KAL_TODAY_ONLY?'show all':'today only'}</a></p>`;

  if(!rows.length){
    const why = (d.skipped||[]).slice(0,6).map(x =>
      `<li class="muted">${x.match} — ${x.reason}</li>`).join('');
    $('#kal').innerHTML = head + toggle
      + `<p class="muted">No tickets for today.</p>` + (why ? `<ul>${why}</ul>` : '');
    wireKalToggle();
    return;
  }
  $('#kal').innerHTML = head + toggle + `<div class="scroll"><table><thead><tr>
      <th class="l">Backing</th><th class="l">Starts</th><th>Model</th><th>Price</th>
      <th>Contracts</th><th>Stake</th><th>Fee</th><th>EV</th><th></th>
    </tr></thead><tbody>
    ${rows.map((t,i)=>`<tr>
      <td class="l"><span class="key">${t.backing}</span>
        <span class="sub">${t.match} · ${t.ticker}</span></td>
      <td class="l">${localTime(t.starts)}
        <span class="sub">${startsIn(t.starts)}</span></td>
      <td class="fig">${pct(t.model_prob)}</td>
      <td class="fig">${num(t.price,2)}</td>
      <td>${t.contracts}${t.size_capped?`<br><span class="dim">book has ${Math.floor(t.offered)}</span>`:''}</td>
      <td class="fig">$${num(t.stake,2)}</td>
      <td class="dim">$${num(t.fee,2)}</td>
      <td class="lead ${t.ev>0?'up':'down'}">${t.ev>0?'+':''}$${num(t.ev,2)}
        <br><span class="dim">${num(t.ev_pct,1)}%</span></td>
      <td>${t.already_placed
        ? `<span class="dim">held${t.held?' '+num(t.held,0):''}</span>
           <br><button class="ghost" data-k="${i}">Add more…</button>`
        : `<button data-k="${i}">Place…</button>`}</td>
    </tr>`).join('')}
    </tbody></table></div>
    <p class="note">A ticket is not an order. Placing one asks for confirmation
      first, and every limit is re-checked on the server — the browser is the
      wrong place to enforce a spending cap.</p>`;

  wireKalToggle();
  $('#kal').querySelectorAll('button[data-k]').forEach(btn => {
    btn.onclick = async () => {
      const t = rows[+btn.dataset.k];
      /* A ticket you already hold is the SAME advice re-read, not new advice.
         Say so plainly before letting it become a second position. */
      const ok = confirm(
        (t.already_placed
          ? `You ALREADY hold ${t.held?num(t.held,0)+' contracts on ':''}this contract.
This adds to that position — it is not a second bet the model asked for.

`
          : '') +
        `Place this order?

${t.backing} to win — ${t.match}
` +
        `${t.contracts} contracts at ${num(t.price,2)}
` +
        `Cost $${num(t.stake,2)} plus $${num(t.fee,2)} fee
` +
        `Expected value ${t.ev>0?'+':''}$${num(t.ev,2)}

` +
        (d.armed ? 'This WILL send a real order.' : 'Dry run: nothing will be sent.'));
      if(!ok) return;
      btn.disabled = true; btn.textContent = 'Placing…';
      try {
        const r = await fetch('/api/kalshi/submit', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({confirm:true, ticker:t.ticker,
            contracts:t.contracts, price:t.price,
            client_order_id:t.client_order_id, match:t.match,
            backing:t.backing, tour:t.tour})}).then(x=>x.json());
        btn.textContent = r.ok ? (r.dry_run ? 'Dry run logged' : 'Placed') : 'Refused';
        if(!r.ok) alert('Not placed: ' + (r.error || 'unknown'));
        /* Refresh after EVERY attempt, not just a fill. A filled order lowers
           the bankroll, which lowers the per-ticket cap, and every other ticket
           on screen was sized against the old balance - left alone they get
           refused for being a dollar over a cap that moved beneath them. A
           REFUSED order matters too: the usual reason it was refused is that
           the account already moved.

           Awaited and announced, because the previous version fired these and
           returned immediately, so a slow rescan looked like nothing happening
           and the balance appeared stuck. */
        if(!r.dry_run) await refreshKalshi('after placing');
      } catch(e){ btn.textContent = 'Failed'; alert(e); }
    };
  });
}

/* ─── Kalshi ──────────────────────────────────────────────────────────────────
   One filter at the top, then sections that all obey it. The filter used to sit
   in a card of its own containing nothing but a dropdown, which read as an empty
   panel rather than as a control for the page.

   Sections are kept apart because they answer different questions:
     Tickets    what the model would back now
     Positions  what is OPEN, marked to the current bid
     Orders     what was SENT - including the ones that never traded
     Settled    what RESOLVED, which is the only real P/L

   An order that rested and never filled cost nothing and proves nothing, so it
   never reaches the record.                                                  */
async function viewKalshi(){
  $('#view').innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:flex-end">
        <h2 style="margin:0">Kalshi</h2>
        <div class="row" style="margin:0;align-items:flex-end">
          <div><label>Showing</label><select id="kscope">
            <option value="page">This model only</option>
            <option value="tennis">All tennis (incl. your own)</option>
            <option value="account">Everything on Kalshi</option>
          </select></div>
          <button id="krefresh">Refresh</button>
        </div>
      </div>
      <p class="muted" id="kalstatus">loading…</p>
      <div id="kacct" class="muted">loading…</div>
      <p class="note" id="kscopenote"></p>
    </div>
    <div class="card"><h2>Tickets to place</h2>
      <p class="note">Today's picks, sized to your balance, sorted by win
        probability — most likely first. Times are your local ${TZLABEL}.
        A ticket is not an order — placing one asks for confirmation first.</p>
      <div id="kal" class="muted">loading…</div></div>
    <div class="card"><h2>Performance</h2><div id="kperf" class="muted">loading…</div></div>
    <div class="card"><h2>Open positions</h2><div id="kpos" class="muted">loading…</div></div>
    <div class="card"><h2>Orders sent</h2><div id="kord" class="muted">loading…</div></div>
    <div class="card"><h2>Settled</h2><div id="krec" class="muted">loading…</div></div>`;
  refreshKalshi();
  $('#kscope').onchange = () => loadKalshiReport($('#kscope').value);
  $('#krefresh').onclick = () => refreshKalshi('on request');
  /* Keep the balance and positions current without being asked. Sixty seconds
     is slow enough to be a rounding error against the rate limit and fast
     enough that the account never looks stale. Cleared on navigation so it
     does not keep polling from a page nobody is looking at. */
  clearInterval(KAL_TIMER);
  KAL_TIMER = setInterval(() => {
    if($('#kacct')) loadKalshiReport($('#kscope')?.value);
    else clearInterval(KAL_TIMER);
  }, 60000);
}

/* How long until it starts. A timestamp alone makes you do the arithmetic, and
   the thing you actually want to know is whether there is still time to act -
   or whether the match is already under way, in which case the guard will
   refuse the ticket anyway. */
const startsIn = iso => {
  const d = new Date(iso); if(isNaN(d)) return '';
  const m = Math.round((d - Date.now())/60000);
  if(m < 0) return 'under way';
  if(m < 60) return `in ${m}m`;
  const h = Math.floor(m/60);
  return h < 24 ? `in ${h}h ${m%60}m` : `in ${Math.floor(h/24)}d ${h%24}h`;
};
const money = (v,d=2) => v==null?'—':(v<0?'-$':'$')+Math.abs(+v).toFixed(d);
const signed = (v,d=2) => v==null?'—':(v>0?'+':'')+money(v,d);
const cls = v => v>0?'up':(v<0?'down':'');
/* Reuses the .stat block the rest of the dashboard already uses, rather than
   inventing a second look for the same idea. `hero` marks the two figures worth
   reading first; the others are the same size as each other so they do not all
   compete for attention. */
const stat = (label, value, sub, klass, hero) => `
  <div class="stat${hero?' hero':''}">
    <div class="k">${label}</div>
    <div class="v ${klass||''}">${value}</div>
    ${sub?`<div class="s">${sub}</div>`:''}
  </div>`;

async function loadKalshiReport(scope){
  let d;
  try { d = await api('/api/kalshi/report', scope?{scope}:{}); }
  catch(e){ $('#kacct').innerHTML = `<div class="err">${e}</div>`; return; }
  if(d.available === false){
    ['#kacct','#kperf','#kord','#kpos','#krec'].forEach(x=>{ if($(x))
      $(x).innerHTML = `<p class="muted">${d.reason||'unavailable'}</p>`; });
    return;
  }
  const b = d.budget||{}, c = d.caps||{}, r = d.record||{};
  const err = k => d.errors && d.errors[k]
    ? `<div class="err">${k}: ${d.errors[k]}</div>` : '';

  $('#kacct').innerHTML = err('balance') + `<div class="grid">
      ${stat('Balance', money(d.balance), d.live?'live account':'demo', '', true)}
      ${stat('Per ticket', money(b.bankroll*c.ticket_pct/100),
             c.ticket_pct+'% of bankroll')}
      ${stat('Used today', money(b.committed),
             money(b.daily_remaining)+' left of '+money(b.daily_cap))}
      ${stat('Mode', d.armed?'ARMED':'Safe',
             d.armed?'confirmed tickets are sent':'tickets are logged only',
             d.armed?'down':'dim')}
    </div>`;

  const sc = d.scope_counts||{};
  const hidden = Object.values(sc).reduce((n,x)=>n+((x.account||0)-(x.shown||0)),0);
  const what = {page:'only the orders this page placed',
                tennis:'all tennis markets, including ones you traded yourself',
                account:'your entire Kalshi account, every sport'}[d.scope];
  $('#kscopenote').innerHTML = `Showing <b>${what}</b>.` + (d.scope==='page'
    ? (hidden ? ` <b>${hidden}</b> other account record(s) hidden.`
              : ' Nothing else on the account to hide.')
    : ` <b>These are not this model's results.</b> Its own record is under
        “This model only”.`);

  /* Performance. Total return and realised lead, because they are the reason to
     open this page; the rest supports them. Realised alone reads as a flat zero
     while everything is still open. */
  const whose = {page:'', tennis:'all tennis trades, yours included',
                 account:'your whole Kalshi account, every sport'}[d.scope];
  $('#kperf').innerHTML = err('settlements') + (whose
    ? `<div class="err" style="margin-bottom:12px">Showing <b>${whose}</b> —
        <b>not this model's performance</b>. The model's own three positions are
        still open and have never settled.</div>` : '') + `<div class="grid">
      ${stat('Total return', signed(r.total_return), 'realised + open mark',
             cls(r.total_return), true)}
      ${stat('Realised', signed(r.realised_pl),
             r.settled?`${r.settled} settled${r.roi_pct!=null?' · '+r.roi_pct+'% ROI':''}`
                      :'nothing settled yet', cls(r.realised_pl), true)}
      ${stat('Open exposure', money(r.open_exposure),
             `${r.open_positions} position(s) · mark ${money(r.open_mark)}`)}
      ${stat('Unrealised', signed(r.open_unrealised), 'mark vs cost',
             cls(r.open_unrealised))}
      ${stat('Record', r.settled?`${r.won}–${r.lost}`:'—',
             r.win_pct!=null?r.win_pct+'% win rate':'nothing settled')}
      ${stat('Fees', money(r.fees), `${r.orders_filled}/${r.orders_sent} orders filled`)}
    </div>
    ${(d.by_sport||[]).length ? `
    <h3>By sport</h3>
    <div class="scroll"><table><thead><tr>
      <th class="l">Sport</th><th>Orders</th><th>Open</th><th>Exposure</th>
      <th>Settled</th><th>Staked</th><th>Realised</th><th>ROI</th>
    </tr></thead><tbody>${d.by_sport.map(x=>`<tr>
      <td class="l"><span class="tag">${x.sport}</span></td>
      <td>${x.filled}/${x.orders}</td><td>${x.open}</td>
      <td class="fig">${money(x.open_exposure)}</td>
      <td>${x.settled}${x.settled?` <span class="dim">(${x.won}W)</span>`:''}</td>
      <td class="fig">${money(x.staked)}</td>
      <td class="lead ${cls(x.realised_pl)}">${signed(x.realised_pl)}</td>
      <td class="fig ${cls(x.roi_pct)}">${x.roi_pct!=null?x.roi_pct+'%':'—'}</td>
    </tr>`).join('')}</tbody></table></div>` : ''}
    ${r.settled ? `<p class="note">Best <b>${signed(r.best)}</b> · worst
      <b>${signed(r.worst)}</b> · average stake <b>${money(r.avg_stake)}</b></p>` : ''}`;

  const ps = d.positions||[];
  $('#kpos').innerHTML = err('positions') + (!ps.length
    ? `<p class="muted">Nothing open.</p>`
    : `<div class="scroll"><table><thead><tr>
      <th class="l">Backing</th><th>Contracts</th>
      <th>Cost</th><th>Bid</th><th>Mark</th><th>Unrealised</th>
      </tr></thead><tbody>${ps.map(x=>`<tr>
      <td class="l"><span class="tag">${x.sport}</span>
        <span class="key"> ${x.backing}</span>
        <span class="sub">${x.ticker}</span></td>
      <td class="fig">${num(x.contracts,0)}</td><td class="fig">${money(x.traded)}</td>
      <td>${num(x.bid,2)}</td><td class="fig">${money(x.mark)}</td>
      <td class="lead ${cls(x.unrealised)}">${signed(x.unrealised)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="note">Marked at the resting <b>bid</b> — what you could sell for
        now, not what you paid. On a thin book the bid is often zero, which marks
        a live position at nothing; that is the real price, not an error.</p>`);

  const os = d.orders||[];
  $('#kord').innerHTML = err('orders') + (!os.length
    ? `<p class="muted">No orders sent.</p>`
    : `<p class="muted"><b>${r.orders_sent}</b> sent ·
        <b>${r.orders_filled}</b> filled · ${r.orders_unfilled} never traded</p>
      <div class="scroll"><table><thead><tr>
      <th class="l">Backing</th><th>Price</th><th>Placed</th><th>Filled</th>
      <th class="l">Status</th><th>Fees</th><th class="l">When</th>
      </tr></thead><tbody>${os.map(o=>`<tr>
      <td class="l"><span class="tag">${o.sport}</span>
        <span class="key"> ${o.backing}</span>
        <span class="sub">${o.ticker}</span></td>
      <td class="fig">${num(o.price,2)}</td><td>${num(o.placed,0)}</td>
      <td class="fig ${o.filled?'up':'dim'}">${num(o.filled,0)}</td>
      <td class="l ${o.status==='executed'?'up':'dim'}">${o.status||'—'}</td>
      <td class="dim">${money(o.fees)}</td>
      <td class="l dim">${localTime(o.created)}</td></tr>`).join('')}
      </tbody></table></div>`);

  const ss = d.settlements||[];
  $('#krec').innerHTML = err('settlements') + (!ss.length
    ? `<p class="muted">Nothing has settled${ps.length
        ? ` — <b>${ps.length}</b> position(s) still open`:''}. No P/L to report yet.</p>`
    : `<div class="scroll"><table><thead><tr>
      <th class="l">Backed</th><th>Contracts</th><th>Cost</th><th>Returned</th>
      <th>P/L</th><th class="l">Settled</th>
      </tr></thead><tbody>${ss.map(x=>`<tr>
      <td class="l"><span class="tag">${x.sport}</span>
        <span class="key"> ${x.backing}</span>
        <span class="sub">${x.ticker}</span></td>
      <td>${num(x.contracts,0)}</td>
      <td class="fig">${money(x.cost)}</td><td class="fig">${money(x.revenue)}</td>
      <td class="lead ${cls(x.pl)}">${signed(x.pl)}</td>
      <td class="l dim">${localTime(x.at)}</td></tr>`).join('')}
      </tbody></table></div>`);
}


async function viewToday(){
  $('#view').innerHTML = `
   <div class="card">
    <h2>Today's fixtures <span class="muted" style="font-weight:400">— live odds</span></h2>
    <div class="row">
      <div><label>Tours</label><select id="tours">
        <option value="atp,wta">ATP + WTA</option>
        <option value="atp">ATP only</option>
        <option value="wta">WTA only</option></select></div>
      <div><label>Sort</label><select id="sort">
        <option value="time">Start time</option>
        <option value="bet">Bets first</option>
        <option value="edge">Biggest disagreement</option></select></div>
      <button id="reload">Refresh odds</button>
    </div>
    <div id="out"><p class="muted">Loading fixtures…</p></div>
   </div>
   <div class="card">
    <h2>Track record <span class="muted" style="font-weight:400">— every bet this page has named</span></h2>
    <div id="rec"><p class="muted">Loading record…</p></div>
   </div>
   <div class="card">
    <h2>Kalshi <span class="muted" style="font-weight:400">— tickets, orders and record</span></h2>
    <p class="note">Betting lives on its own page now, so orders and the settled
      record sit next to the tickets that produced them.
      <a href="#/kalshi">Open the Kalshi tab →</a></p>
   </div>`;

  let DATA = null;

  async function load(force){
    $('#out').innerHTML = '<p class="muted">Fetching live odds…</p>';
    const q = {tours: $('#tours').value};
    if(force) q.refresh = '1';
    DATA = await api('/api/fixtures', q);
    render();
    loadRecord();
  }

  function render(){
    const d = DATA;
    if(!d) return;
    if(d.available === false){
      $('#out').innerHTML = `<div class="err">Live odds unavailable — ${d.reason||'unknown'}</div>
        <p class="muted" style="margin-top:10px">Set <code>ODDS_API_KEY</code> on the service
        to enable this view.</p>`;
      return;
    }
    if(d.error){ $('#out').innerHTML = `<div class="err">${d.error}</div>`; return; }
    const m = d.meta || {};
    const rows = (d.fixtures||[]).slice();
    if(!rows.length){
      $('#out').innerHTML = `<p class="muted">No upcoming fixtures posted right now.
        ${m.already_started?`(${m.already_started} already under way — their prices are
        in-play, so they are excluded.)`:''}</p>`;
      return;
    }

    const s = $('#sort').value;
    if(s==='edge') rows.sort((a,b)=>Math.abs(b.disagreement_a??0)-Math.abs(a.disagreement_a??0));
    else if(s==='bet') rows.sort((a,b)=>((b.bet?b.bet.ev:-9))-((a.bet?a.bet.ev:-9)));
    else rows.sort((a,b)=>String(a.commence_time||'').localeCompare(String(b.commence_time||'')));

    const byTour = m.staleness_by_tour || {};
    const staleTours = Object.entries(byTour).filter(([,v]) => v.stale_days > 21);
    const freshTours = Object.entries(byTour).filter(([,v]) => v.stale_days <= 21);
    const staleBox = staleTours.length ? `
      <div class="err" style="margin-bottom:12px">
        <strong>${staleTours.map(([t])=>t.toUpperCase()).join(' and ')} ratings are stale.</strong>
        ${staleTours.map(([t,v])=>`${t.toUpperCase()} ends ${v.as_of} (${v.stale_days} days ago)`).join('; ')}.
        The odds below are live; those model prices are not, so large disagreements on
        ${staleTours.map(([t])=>t.toUpperCase()).join('/')} matches are a symptom of the gap
        rather than an opinion.
        ${freshTours.length?`<br><span style="opacity:.85">${freshTours.map(([t,v])=>
          `${t.toUpperCase()} is current to ${v.as_of}`).join('; ')}.</span>`:''}
      </div>` : (freshTours.length ? `
      <p class="muted" style="margin-bottom:10px">Ratings current to
        ${freshTours.map(([t,v])=>`${t.toUpperCase()} ${v.as_of}`).join(' · ')}.</p>` : '');

    const byEvent = {};
    rows.forEach(r => (byEvent[r.tournament] = byEvent[r.tournament] || []).push(r));

    $('#out').innerHTML = staleBox + `
      <p class="muted">${rows.length} upcoming ·
        all times ${TZLABEL} ·
        ${Object.keys(byEvent).length} tournament(s) ·
        ${m.credits_remaining!=null?`${(+m.credits_remaining).toLocaleString()} API credits left`:''}
        ${m.already_started?` · ${m.already_started} in play (excluded)`:''}
        ${m.unmatched && m.unmatched.length?` · <span class="down">${m.unmatched.length}
          unmatched player(s)</span>`:''}</p>
      ${Object.entries(byEvent).map(([ev, list]) => `
        <h3>${ev} <span class="muted" style="font-weight:400;text-transform:none">
          ${list[0].surface} · best of ${list[0].best_of}</span></h3>
        <div class="scroll"><table><thead><tr>
          <th class="l">Start</th><th class="l">Match</th>
          <th title="What the model thinks the first-named player's chance is, and the decimal odds that would be a fair price for it.">Our price</th>
          <th title="The median decimal price across bookmakers for the first-named player.">Book price</th>
          <th class="l" title="A bet only appears when the book is paying MORE than the model's fair price. Most matches will say no bet - that is the normal and expected outcome.">What to do</th>
          <th title="Quarter Kelly on the model's own number. Sizing, not advice.">Stake</th>
          <th title="How much the model trusts its own inputs for this match.">Confidence</th>
        </tr></thead><tbody>
        ${list.map(r=>{
          const t = localTime(r.commence_time);
          const diff = r.disagreement_a==null?null:r.disagreement_a;
          const side = r.best_side ? (r.best_side==='A'?r.player_a:r.player_b) : null;
          const evc = r.best_ev==null?'':(r.best_ev>0?'up':'down');
          /* Tournament and date MUST travel with the link. Without the event
             the matchup page cannot count matches played at it, so the
             event-progress adjustment never fires and the same fixture is
             priced differently on the two pages - Alexandrova showed 49.8%
             here and 56.7% there, a 7 point gap that was entirely this. */
          const link = '#/matchup/' + [r.tour, r.player_a, r.player_b, r.surface,
              r.best_of, r.tournament||'', localDay(r.commence_time)]
              .map(encodeURIComponent).join('|');
          const b = r.bet;
          const call = b
            ? `<span class="up"><strong>Back ${b.player}</strong> at ${num(b.odds,2)}</span>
               <br><span class="dim">edge ${b.edge_pp}pts, needed ${b.needed_pp}</span>`
            : (r.market_prob_a==null
                ? '<span class="dim">no price posted</span>'
                : `<span class="dim">no bet — ${r.no_bet_reason||'book price is fair or short'}</span>`);
          return `<tr class="click" data-go="${link}">
            <td class="l dim">${t}</td>
            <td class="l"><strong>${r.player_a}</strong> v ${r.player_b}${
              r.started?` <span class="dim" title="This match is under way. Its price is the last one quoted BEFORE it started - in-play odds already know the score, and the model's number does not, so comparing them is meaningless.">· in progress${
                r.odds_frozen?', price frozen':', no pre-match price captured'}</span>`:''}</td>
            <td>${pct(r.model_prob_a)}<br><span class="dim">fair ${num(r.fair_odds_a,2)}</span></td>
            <td>${r.odds_a==null?'—':num(r.odds_a,2)}<br><span class="dim">${
              r.market_prob_a==null?'':pct(r.market_prob_a)}</span></td>
            <td class="l">${call}</td>
            <td>${b?`${b.stake_pct.toFixed(1)}%`:'—'}</td>
            <td class="l ${r.data_quality==='high'?'':'down'}">${r.data_quality}${
              r.ratings_stale_days>21?' <span class="down" title="ratings '
              +r.ratings_stale_days+' days old">·stale</span>':''}</td>
          </tr>`;}).join('')}
        </tbody></table></div>`).join('')}
      <p class="note"><strong>How to read this.</strong>
        <em>Our price</em> is the model's chance for the first-named player, and the
        decimal odds that would be fair for it. <em>Book price</em> is the median
        offered across ${rows[0] && rows[0].books ? rows[0].books : 'all'} bookmakers.
        A bet appears only when the book pays more than the model's fair price AND
        the disagreement is bigger than our ability to measure the model at that
        probability. A positive expectation alone is not enough: EV is computed
        from the model's own number, so it restates a disagreement rather than
        evidencing profit — a model claiming 25% where the truth is 10% still
        prints a large positive EV and still loses. Long odds are where this
        bites hardest, because a single percentage point of error becomes a huge
        apparent return. Most matches will say no bet, and that is the normal
        outcome, not a fault.
        <em>Stake</em> is quarter Kelly on the model's own number.
        Matches already under way stay listed, showing the last price quoted
        BEFORE they started. In-play odds are deliberately not used: they already
        know the score and the model's number does not, and comparing the two is
        what once produced a +468% phantom edge here.
        <br><br>
        <strong>What this is not.</strong> A "Back X" row means the model disagrees
        with the price, not that money is expected. Tested out of sample, this model
        does NOT beat tennis match markets — the same finding is on record for the NFL
        engine in this workspace. When the model and the market disagree, the market is
        the more likely to be right, and today a disagreement on one match turned out
        to be a defect on our side rather than a mispricing on theirs. Treat the stake
        as sizing arithmetic, not as advice.</p>`;
  }

  // Clicking a fixture opens the full matchup for those two players on that
  // surface and format, rather than making the user retype them.
  $('#out').addEventListener('click', e => {
    const tr = e.target.closest('tr[data-go]');
    if (tr) location.hash = tr.dataset.go;
  });

  $('#reload').onclick = () => load(true);
  $('#tours').onchange = () => load(false);
  $('#sort').onchange = render;
  await load(false);
}

/* ─── TOURNAMENTS ─────────────────────────────────────────────────────────── */
async function viewTournaments(arg){
  const st = JSON.parse(localStorage.getItem('tn')||'{}');
  const [tour0, tid0] = (arg||'').split(':');
  $('#view').innerHTML = `
   <div class="card">
    <h2>Tournaments</h2>
    <div class="row">
      <div><label>Tour</label><select id="tour">${
        META.tours.map(t=>`<option ${((tour0||st.tour)===t)?'selected':''}>${t.toUpperCase()}</option>`).join('')}</select></div>
      <div><label>Season</label><select id="season"></select></div>
      <div style="flex:1;min-width:180px"><label>Filter</label>
        <input id="q" placeholder="name contains…" value="${st.q||''}"></div>
    </div>
    <p class="muted">Every prediction below was computed from the ratings as they
      stood <em>before</em> that match was played, so the accuracy column is a real
      out-of-sample record, not hindsight. It counts how often the model favoured
      the player who won; a coin flip is 50%. Figures fill in as each draw is
      priced.</p>
    <div id="list" class="scroll"><p class="muted">Loading…</p></div>
   </div>
   <div id="draw"></div>`;

  const tourFn = () => $('#tour').value.toLowerCase();

  async function loadSeasons(){
    const d = await api('/api/tournaments', {tour: tourFn()});
    const seasons = d.seasons || [];
    const want = st.season && seasons.includes(+st.season) ? +st.season : seasons[0];
    $('#season').innerHTML = seasons.map(y=>
      `<option ${y===want?'selected':''}>${y}</option>`).join('');
    return loadList();
  }

  async function loadList(){
    const tour = tourFn(), season = $('#season').value;
    localStorage.setItem('tn', JSON.stringify({tour, season, q:$('#q').value}));
    $('#list').innerHTML = '<p class="muted">Loading…</p>';
    const d = await api('/api/tournaments', {tour, season});
    if(d.error){ $('#list').innerHTML = `<div class="err">${d.error}</div>`; return; }
    const q = $('#q').value.toLowerCase().trim();
    const rows = (d.tournaments||[]).filter(r=>!q || String(r.name).toLowerCase().includes(q));
    if(!rows.length){ $('#list').innerHTML='<p class="muted">No events match.</p>'; return; }
    const LEVEL = {G:'Slam', M:'Masters', F:'Finals', A:'Tour', P:'Premier',
                   PM:'Prem. Mand.', I:'Intl', D:'Team', C:'Challenger', O:'Olympics'};
    $('#list').innerHTML = `<table><thead><tr>
        <th class="l">Date</th><th class="l">Tournament</th><th class="l">Surface</th>
        <th class="l">Level</th><th>Draw</th><th>Matches</th>
        <th>Model accuracy</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="click" data-id="${r.tourney_id}">
        <td class="l">${r.date||''}</td>
        <td class="l"><strong>${r.name}</strong></td>
        <td class="l">${surf(r.surface)}</td>
        <td class="l">${LEVEL[r.level]||r.level||''}</td>
        <td>${r.draw_size||''}</td><td>${r.matches}</td>
        <td class="acc" data-acc="${r.tourney_id}"><span class="dim">…</span></td>
        </tr>`).join('')}
      </tbody></table>`;
    $('#list').querySelector('table').onclick = e => {
      const tr = e.target.closest('tr[data-id]');
      if(tr) loadDraw(tour, tr.dataset.id);
    };
    fillAccuracy(tour, rows.map(r=>r.tourney_id));
  }

  /* Accuracy is priced per match from pre-match ratings, so a season is minutes
     of work. Ask for a few events at a time and fill the column in as answers
     arrive, rather than making the whole table wait for the slowest draw.
     `token` cancels an in-flight fill when the tour or season changes, so a
     stale batch cannot write into the new table. */
  let accToken = 0;
  async function fillAccuracy(tour, ids){
    const mine = ++accToken;
    for(let i = 0; i < ids.length; i += 6){
      if(mine !== accToken) return;
      const batch = ids.slice(i, i+6);
      let d;
      try { d = await api('/api/tournament/accuracy',
                          {tour, ids: batch.join(',')}); }
      catch(e){ return; }
      if(mine !== accToken) return;
      for(const [tid, a] of Object.entries(d.accuracy||{})){
        const cell = document.querySelector(`[data-acc="${tid}"]`);
        if(!cell) continue;
        cell.innerHTML = (!a || a.error || a.accuracy == null)
          ? '<span class="dim">—</span>'
          : `<span class="fig ${a.accuracy>=0.65?'up':(a.accuracy<0.5?'down':'')}"
              >${pct(a.accuracy)}</span>
             <span class="sub">${a.hits}/${a.scored}</span>`;
      }
    }
  }

  async function loadDraw(tour, tid){
    $('#draw').innerHTML = '<div class="card"><p class="muted">Building the draw — '
      + 'every match is being priced from its pre-match ratings…</p></div>';
    const d = await api('/api/tournament', {tour, tourney_id: tid});
    if(d.error){ $('#draw').innerHTML=`<div class="card"><div class="err">${d.error}</div></div>`; return; }
    const s = d.summary;
    $('#draw').innerHTML = `
     <div class="card" id="drawcard">
      <h2>${d.name} ${d.season} <span class="muted" style="font-weight:400">
        ${d.surface} · best of ${d.best_of}${d.draw_size?` · ${d.draw_size} draw`:''}</span></h2>
      <div class="grid" style="margin:12px 0">
        <div class="stat"><div class="k">Model accuracy</div>
          <div class="v">${s.accuracy==null?'—':pct(s.accuracy)}</div>
          <div class="s">${s.hits}/${s.scored} matches</div></div>
        <div class="stat"><div class="k">Log loss</div>
          <div class="v">${s.logloss==null?'—':num(s.logloss,4)}</div>
          <div class="s">coin flip = 0.6931</div></div>
        <div class="stat"><div class="k">Matches</div>
          <div class="v">${s.matches}</div><div class="s">in the draw</div></div>
      </div>
      <div class="row"><button class="primary" id="odds">Show pre-tournament title odds</button></div>
      <div id="oddsbox"></div>
      ${s.upsets_missed && s.upsets_missed.length ? `<h3>Biggest upsets the model missed</h3>
        <table><thead><tr><th class="l">Round</th><th class="l">Result</th>
          <th class="l">Score</th><th>Model gave winner</th></tr></thead><tbody>
        ${s.upsets_missed.map(u=>`<tr><td class="l">${u.round}</td>
          <td class="l">${u.match}</td><td class="l">${u.score}</td>
          <td class="down">${pct(u.model_prob)}</td></tr>`).join('')}</tbody></table>`:''}
      ${d.round_order.map(r=>{
        const ms = d.rounds[r];
        return `<h3>${ms[0].round_label} <span class="muted" style="font-weight:400;
          text-transform:none">${ms.filter(x=>x.correct).length}/${
          ms.filter(x=>'correct' in x).length} correct</span></h3>
        <table><thead><tr><th></th><th>Model</th><th class="l">Winner</th>
          <th class="l">Loser</th><th class="l">Score</th><th>Exp. games</th>
        </tr></thead><tbody>
        ${ms.map(x=>`<tr>
          <td class="${x.correct?'up':('correct' in x?'down':'dim')}">${
            x.correct?'✓':('correct' in x?'✗':'·')}</td>
          <td>${x.model_prob_winner==null?'—':pct(x.model_prob_winner,0)}</td>
          <td class="l">${x.winner}</td><td class="l dim">${x.loser}</td>
          <td class="l">${x.score||''}${x.retirement?' <span class="dim">RET</span>':''}</td>
          <td>${x.expected_total_games==null?'—':num(x.expected_total_games,1)}</td>
        </tr>`).join('')}</tbody></table>`;}).join('')}
     </div>`;
    location.hash = `#/tournaments/${tour}:${tid}`;
    $('#odds').onclick = async () => {
      $('#oddsbox').innerHTML = '<p class="muted">Simulating every possible pairing '
        + 'in the draw…</p>';
      const b = await api('/api/tournament/bracket', {tour, tourney_id: tid});
      if(!b.available){ $('#oddsbox').innerHTML =
        `<p class="muted">No bracket available (${b.reason||'not a knockout draw'}).</p>`; return; }
      const mx = Math.max(...b.title_odds.map(t=>t.title_prob));
      $('#oddsbox').innerHTML = `
        <h3>Pre-tournament title odds</h3>
        <p class="muted">Simulated forward from round one using each player's rating
          as of the start of the event. Actual champion:
          <strong>${b.actual_champion||'—'}</strong>${b.actual_champion_prob!=null
            ? ` — the model gave them ${pct(b.actual_champion_prob)}` : ''}.</p>
        <p class="note">These are more confident than a bookmaker's prices by
          design: compounding per-match probabilities over six or seven rounds is
          all this does. A market also prices withdrawal, injury and form collapse,
          which drag heavy favourites down. Read 70% as "70% if nothing goes wrong".</p>
        <div class="bars">${b.title_odds.map(t=>`<div>
          <span class="lab" style="width:150px;text-align:right">${t.name}</span>
          <span class="track"><span class="fill" style="width:${t.title_prob/mx*100}%;
            background:${t.name===b.actual_champion?'var(--a)':'var(--accent2)'}"></span></span>
          <span class="val">${pct(t.title_prob,1)}</span></div>`).join('')}</div>`;
      $('#odds').disabled = true;
    };
    $('#drawcard').scrollIntoView({behavior:'smooth', block:'start'});
  }

  $('#tour').onchange = loadSeasons;
  $('#season').onchange = loadList;
  $('#q').oninput = () => { clearTimeout(window._tq);
    window._tq = setTimeout(loadList, 250); };
  await loadSeasons();
  if(tid0) loadDraw(tour0, tid0);
}

/* ─── MATCHUP ─────────────────────────────────────────────────────────────── */
async function viewMatchup(arg){
  const st = JSON.parse(localStorage.getItem('mu')||'{}');
  // #/matchup/tour|A|B|surface|bestOf — set when arriving from a fixture row.
  if (arg) {
    const [tr, a, b, sf, bo, tn, dt] = arg.split('|').map(decodeURIComponent);
    if (a && b) Object.assign(st, {tour: tr, a, b, surface: sf, bo: String(bo || 3),
                                   tournament: tn || '', date: dt || ''});
  }
  $('#view').innerHTML = `
   <div class="card">
    <h2>Matchup predictor</h2>
    <div class="row">
      <div style="flex:1;min-width:190px" class="ac">
        <label>Player A</label><input id="a" placeholder="type a name…" value="${st.a||''}"></div>
      <div style="flex:1;min-width:190px" class="ac">
        <label>Player B</label><input id="b" placeholder="type a name…" value="${st.b||''}"></div>
      <div><label>Tour</label><select id="tour">${
        META.tours.map(t=>`<option ${st.tour===t?'selected':''}>${t.toUpperCase()}</option>`).join('')}</select></div>
      <div><label>Surface</label><select id="surface">${
        META.surfaces.filter(s=>s!=='overall').map(s=>
          `<option ${st.surface===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div><label>Format</label><select id="bo">
        <option value="3">Best of 3</option>
        <option value="5" ${st.bo=='5'?'selected':''}>Best of 5</option></select></div>
      <div><label>Indoor</label><select id="indoor">
        <option value="0">No</option><option value="1" ${st.indoor=='1'?'selected':''}>Yes</option></select></div>
      <button class="primary" id="go">Predict</button>
    </div>
    <div id="out"></div>
   </div>`;

  const tourFn = () => $('#tour').value.toLowerCase();
  autocomplete($('#a'), tourFn); autocomplete($('#b'), tourFn);

  const run = async () => {
    const a=$('#a').value.trim(), b=$('#b').value.trim();
    if(!a||!b){ $('#out').innerHTML='<div class="err">Enter both players.</div>'; return; }
    const q = {a,b,tour:tourFn(),surface:$('#surface').value,
               best_of:$('#bo').value,indoor:$('#indoor').value};
    // Context from the fixture that was clicked. The engine needs the event to
    // apply in-tournament progress; without it this page silently prices a
    // different match from the one on the Today page.
    if(st.tournament) q.tournament = st.tournament;
    if(st.date) q.date = st.date;
    localStorage.setItem('mu', JSON.stringify({...q, bo:q.best_of}));
    $('#out').innerHTML='<p class="muted">Simulating…</p>';
    const p = await api('/api/matchup', q);
    if(p.error){ $('#out').innerHTML=`<div class="err">${p.error}</div>`; return; }
    renderPrediction(p);
  };
  $('#go').onclick = run;
  ['a','b'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{
    if(e.key==='Enter' && !document.querySelector('.acmenu[style*="block"]')) run();
  }));
  if(st.a && st.b) run();
}

  const setKeys = Object.keys(p.set_score_probs);
  const maxSet = Math.max(...Object.values(p.set_score_probs));
  const tg = p.total_games_probs, maxTg = Math.max(...Object.values(tg));
  const adj = p.elo_adjustments||{};

  $('#out').innerHTML = `
   <div class="names"><span>${A.name}</span><span>${B.name}</span></div>
   <div class="bigbar">
     <div class="ba" style="width:${wa*100}%">${pct(wa)}</div>
     <div class="bb" style="width:${wb*100}%">${pct(wb)}</div>

   <div class="names muted"><span>fair ${num(p.fair_odds_a,2)}</span>

       <div class="s">games, ${A.name.split(' ').pop()}</div></div>
     <div class="stat" title="The total at which over and under are a coin flip. Measured: goes over 49.4% over 12,000 replayed matches.">
       <div class="k">Fair total</div>
       <div class="v">${num(p.fair_total_games_line,1)}</div>
       <div class="s">games · 50/50 line</div></div>
     <div class="stat"><div class="k">Hold %</div>
       <div class="v">${pct(p.hold_prob_a,0)} / ${pct(p.hold_prob_b,0)}</div>
       <div class="s">A / B service games</div></div>
     <div class="stat"><div class="k">Straight sets</div>
       <div class="v">${pct(p.p_straight_sets_a,0)}</div>

     <div class="stat"><div class="k">Data quality</div>
       <div class="v">${p.data_quality.level}</div>
       <div class="s">${p.data_quality.flags.length

   </div>

   <h3>How the number was formed</h3>
   <table><thead><tr><th class="l">Component</th><th>P(${A.name.split(' ').pop()})</th>
     <th>Weight</th></tr></thead><tbody>
     <tr><td class="l">Surface Elo (adjusted)</td><td>${pct(p.components.elo)}</td>
       <td>${pct(p.components.weights.elo||0,0)}</td></tr>
     <tr><td class="l">Serve/return simulation</td><td>${pct(p.components.serve_return)}</td>
       <td>${pct(p.components.weights.serve_return||0,0)}</td></tr>
     ${p.components.market!=null?`<tr><td class="l">Market</td>
       <td>${pct(p.components.market)}</td>
       <td>${pct(p.components.weights.market||0,0)}</td></tr>`:''}
     <tr style="font-weight:700"><td class="l">Blended</td><td>${pct(wa)}</td><td>—</td></tr>
   </tbody></table>

   <h3>Rating detail</h3>
   <table><thead><tr><th class="l"></th><th>${A.name}</th><th>${B.name}</th></tr></thead>
   <tbody>
     <tr><td class="l">Elo (overall)</td><td>${num(A.elo)}</td><td>${num(B.elo)}</td></tr>
     <tr><td class="l">Elo (${p.surface})</td><td>${num(A.elo_surface)}</td>
       <td>${num(B.elo_surface)}</td></tr>
     <tr><td class="l">Serve excess</td><td>${pct(A.serve_excess,1)}</td>
       <td>${pct(B.serve_excess,1)}</td></tr>
     <tr><td class="l">Return excess</td><td>${pct(A.return_excess,1)}</td>
       <td>${pct(B.return_excess,1)}</td></tr>
     <tr><td class="l">Days rest</td><td>${num(A.days_rest)}</td><td>${num(B.days_rest)}</td></tr>
     <tr><td class="l">Fatigue index</td><td>${num(A.fatigue_index,2)}</td>
       <td>${num(B.fatigue_index,2)}</td></tr>
   </tbody></table>
   ${Object.keys(adj).length?`<p class="muted" style="margin-top:9px">
     Elo gap ${num(p.elo_gap_raw,1)} → ${num(p.elo_gap_adjusted,1)} after:
     ${Object.entries(adj).map(([k,v])=>`${k} ${v>0?'+':''}${num(v,1)}`).join(', ')}
     ${p.h2h.n?` · head-to-head ${p.h2h.raw_wins}-${p.h2h.raw_losses}`:''}</p>`:''}

   ${(p.rally_a || p.rally_b) ? `
   <h3>Rally profile</h3>
   <table><thead><tr><th class="l"></th><th>${A.name}</th><th>${B.name}</th></tr></thead>
   <tbody>
     ${[['Winners','winner_rate'],['Unforced errors','ue_rate'],
        ['Aggression','aggression'],['Net points','net_freq'],
        ['Net points won','net_win']].map(([lab,k])=>`<tr>
       <td class="l">${lab}</td>
       <td>${p.rally_a?pct(p.rally_a[k]):'—'}</td>
       <td>${p.rally_b?pct(p.rally_b[k]):'—'}</td></tr>`).join('')}
     <tr><td class="l">Style</td>
       <td>${p.rally_a?p.rally_a.style:'—'}</td>
       <td>${p.rally_b?p.rally_b.style:'—'}</td></tr>
     <tr><td class="l dim">Matches measured</td>
       <td class="dim">${p.rally_a?p.rally_a.matches:'—'}</td>
       <td class="dim">${p.rally_b?p.rally_b.matches:'—'}</td></tr>
   </tbody></table>
   <p class="note">Rates are per point played, opponent-adjusted and taken only
     from matches BEFORE this one. They describe how a player plays, not how likely
     they are to win — and they are <strong>not inputs to the prediction above</strong>.
     Tested over 6,949 matches, the strongest rally feature correlated with the
     model's error at r=0.02 and adding it gained nothing, so it was left out.
     ATP only; winners and unforced errors are scored by hand at the venue and
     exist for roughly 44% of matches since 2021 and none before.</p>` : ''}

   <h3>Set score</h3>
   <div class="bars">${setKeys.map(k=>{
      const v=p.set_score_probs[k], aWin=+k.split('-')[0] > +k.split('-')[1];
      return `<div><span class="lab">${k}</span>
        <span class="track"><span class="fill" style="width:${v/maxSet*100}%;
          background:${aWin?'var(--a)':'var(--b)'}"></span></span>
        <span class="val">${pct(v,0)}</span></div>`;}).join('')}</div>

   <h3>Total games</h3>
   <div class="bars">${Object.entries(tg).filter(([,v])=>v>0.008).map(([k,v])=>
     `<div><span class="lab">${k}</span>
      <span class="track"><span class="fill" style="width:${v/maxTg*100}%;
        background:var(--accent2)"></span></span>
      <span class="val">${pct(v,1)}</span></div>`).join('')}</div>

   <h3>Game margin <span class="muted" style="font-weight:400;text-transform:none">
     — ${A.name.split(' ').pop()} games minus ${B.name.split(' ').pop()} games</span></h3>
   <div class="bars">${(()=>{const gm=p.game_margin_probs||{};
     const es=Object.entries(gm).filter(([,v])=>v>0.008);
     const mx=Math.max(...es.map(([,v])=>v),1e-9);
     return es.map(([k,v])=>`<div><span class="lab">${+k>0?'+':''}${k}</span>
       <span class="track"><span class="fill" style="width:${v/mx*100}%;
         background:${+k>0?'var(--a)':+k<0?'var(--b)':'var(--dim)'}"></span></span>
       <span class="val">${pct(v,1)}</span></div>`).join('');})()}</div>

   <h3>Most likely scorelines</h3>
   <table><thead><tr><th class="l">Score</th><th>Probability</th></tr></thead><tbody>
     ${p.likely_scorelines.map(s=>`<tr><td class="l">${s.score}</td>
       <td>${pct(s.prob,1)}</td></tr>`).join('')}
   </tbody></table>
   <p class="note">Score markets are reconciled to the headline win probability:
     the point-level serve rates are shifted symmetrically until the Markov chain
     reproduces ${pct(wa)} exactly, so the games line and the win probability can
     never disagree.</p>`;
}

/* ─── PLAYER ──────────────────────────────────────────────────────────────── */
async function viewPlayer(arg){
  const [tour0,id0] = (arg||'').split(':');
  $('#view').innerHTML = `
   <div class="card">
    <h2>Player profile</h2>
    <div class="row">
      <div style="flex:1;min-width:230px" class="ac">
        <label>Player</label><input id="p" placeholder="type a name…"></div>
      <div><label>Tour</label><select id="tour">${
        META.tours.map(t=>`<option ${t===tour0?'selected':''}>${t.toUpperCase()}</option>`).join('')}</select></div>
    </div>
    <div id="out"><p class="muted">Search for a player, or click one in the rankings.</p></div>
   </div>`;
  autocomplete($('#p'), ()=>$('#tour').value.toLowerCase(),
    it => load(it.id));

  async function load(id){
    $('#out').innerHTML='<p class="muted">Loading…</p>';
    const d = await api('/api/player',{tour:$('#tour').value.toLowerCase(), id});
    if(d.error){ $('#out').innerHTML=`<div class="err">${d.error}</div>`; return; }
    $('#p').value = d.name;
    const ov = d.splits.find(s=>s.surface==='overall')||{};
    $('#out').innerHTML = `
      <h2 style="margin-bottom:2px">${d.name}
        <span class="muted" style="font-weight:400">${d.ioc||''}
        ${d.hand?'· '+(d.hand==='L'?'left-handed':'right-handed'):''}
        ${d.height?'· '+num(d.height)+'cm':''}</span></h2>
      <div class="grid" style="margin:14px 0">
        <div class="stat"><div class="k">Elo</div><div class="v">${num(ov.elo)}</div>
          <div class="s">${ov.matches||0} matches</div></div>
        ${d.record_by_surface.map(r=>`<div class="stat">
          <div class="k">${r.surface}</div><div class="v">${pct(r.win_pct,0)}</div>
          <div class="s">${r.wins}-${r.losses}</div></div>`).join('')}
      </div>
      <h3>Rating history</h3>${sparkline(d.curve)}
      <h3>Surface splits</h3>
      <table><thead><tr><th class="l">Surface</th><th>Elo</th><th>Matches</th>
        <th>Serve excess</th><th>Return excess</th></tr></thead><tbody>
        ${d.splits.map(s=>`<tr><td class="l">${s.surface==='overall'?'Overall':surf(s.surface)}</td>
          <td>${num(s.elo)}</td><td>${s.matches}</td>
          <td>${pct(s.serve_excess,1)}</td><td>${pct(s.return_excess,1)}</td></tr>`).join('')}
      </tbody></table>
      <h3>Recent results</h3>
      <table><thead><tr><th class="l">Date</th><th class="l">Tournament</th>
        <th class="l">Surface</th><th class="l">Rd</th><th class="l">Result</th>
        <th class="l">Opponent</th><th class="l">Score</th></tr></thead><tbody>
        ${d.results.map(r=>`<tr><td class="l">${r.date}</td>
          <td class="l">${r.tournament}</td><td class="l">${surf(r.surface)}</td>
          <td class="l">${r.round}</td>
          <td class="l ${r.won?'up':'down'}">${r.won?'W':'L'}</td>
          <td class="l">${r.opponent}</td><td class="l">${r.score}</td></tr>`).join('')}
      </tbody></table>`;
  }
  if(id0) load(id0);
}

function sparkline(curve){
  if(!curve || curve.length<2) return '<p class="muted">Not enough history.</p>';
  const W=1000, H=170, pad=26;
  const xs = curve.map((_,i)=>i);
  const ys = curve.map(c=>c.elo);
  const y0=Math.min(...ys), y1=Math.max(...ys), span=(y1-y0)||1;
  const X = i => pad + i/(xs.length-1)*(W-2*pad);
  const Y = v => H-pad - (v-y0)/span*(H-2*pad);
  const path = curve.map((c,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(c.elo).toFixed(1)}`).join('');
  const COL={Hard:'var(--hard)',Clay:'var(--clay)',Grass:'var(--grass)',Carpet:'#8c78be'};
  const dots = curve.filter((_,i)=>i%Math.ceil(curve.length/160)===0)
    .map((c,j,arr)=>{const i=curve.indexOf(c);
      return `<circle cx="${X(i).toFixed(1)}" cy="${Y(c.elo).toFixed(1)}" r="1.9"
        fill="${COL[c.surface]||'var(--dim)'}" opacity=".85"/>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.7"/>
    ${dots}
    <text x="${pad}" y="16" fill="var(--dim)" font-size="11">${num(y1)}</text>
    <text x="${pad}" y="${H-6}" fill="var(--dim)" font-size="11">${num(y0)}</text>
    <text x="${W-pad}" y="${H-6}" fill="var(--dim)" font-size="11"
      text-anchor="end">${curve[curve.length-1].date}</text>
  </svg>
  <p class="muted">Dot colour = surface. ${curve.length} matches shown.</p>`;
}

/* ─── MODEL / BACKTEST ────────────────────────────────────────────────────── */
async function viewModel(){
  $('#view').innerHTML = `<div class="card"><h2>Model validation</h2>
    <div id="out"><p class="muted">Loading…</p></div></div>`;
  const raw = await api('/api/backtest');
  const d = Array.isArray(raw) ? raw : (raw.rows || raw);
  const bmeta = (raw && raw.meta) || {};
  if(raw.error){
    $('#out').innerHTML = `<div class="err">${d.error}</div>
      <p class="muted" style="margin-top:11px">Run:
      <code>python backtest.py --seasons 2020-2026</code></p>`;
    return;
  }
  const overall = d.find(r=>r.label==='OVERALL') || d[0];
  $('#out').innerHTML = `
    <div class="grid">
      <div class="stat"><div class="k">Log loss</div>
        <div class="v">${num(overall.logloss,4)}</div>
        <div class="s">coin flip = 0.6931</div></div>
      <div class="stat"><div class="k">Accuracy</div>
        <div class="v">${pct(overall.accuracy)}</div>
        <div class="s">${(+overall.n).toLocaleString()} matches</div></div>
      <div class="stat"><div class="k">Brier</div>
        <div class="v">${num(overall.brier,4)}</div>
        <div class="s">lower is better</div></div>
      <div class="stat"><div class="k">Elo spread</div>
        <div class="v">${num(overall.elo_multiplier,2)}</div>
        <div class="s">${Math.abs(overall.elo_multiplier-1)<0.05?'well scaled':
          overall.elo_multiplier<1?'over-confident':'under-confident'}</div></div>
      ${overall.total_games_mae?`<div class="stat"><div class="k">Total games MAE</div>
        <div class="v">${num(overall.total_games_mae,2)}</div>
        <div class="s">bias ${num(overall.total_games_bias,2)}</div></div>`:''}
    </div>
    <h3>Breakdowns</h3>
    <table><thead><tr><th class="l">Slice</th><th>n</th><th>Log loss</th>
      <th>Brier</th><th>Accuracy</th><th>Elo mult.</th></tr></thead><tbody>
      ${d.map(r=>`<tr><td class="l">${r.label}</td>
        <td>${(+r.n).toLocaleString()}</td><td>${num(r.logloss,4)}</td>
        <td>${num(r.brier,4)}</td><td>${pct(r.accuracy)}</td>
        <td>${num(r.elo_multiplier,2)}</td></tr>`).join('')}
    </tbody></table>
    <p class="note">Walk-forward and out of sample by construction: every rating
      read here was frozen before the match it predicts. Player A is fixed as the
      lower player id, so row order carries no information about the result.
      ${bmeta.generated_at ? `<br>Measured on ${(+bmeta.matches||0).toLocaleString()}
        matches, seasons ${bmeta.seasons}, generated ${bmeta.generated_at}
        (${bmeta.source}). Score-market metrics are excluded from this run.` : ''}</p>`;
}

/* ─── boot ────────────────────────────────────────────────────────────────── */
(async function(){
  try {
    META = await api('/api/meta');
  } catch(e){
    $('#view').innerHTML = `<div class="card"><div class="err">
      Could not reach the API. Is the server running?</div></div>`;
    return;
  }

  // Provenance is always on screen: a viewer must never have to guess whether
  // they are looking at real results or the synthetic generator's output.
  if(META.synthetic){
    $('#warn').innerHTML = '<div class="warn">SYNTHETIC DATA — not real results</div>';
  } else if(META.built_at){
    const when = String(META.built_at).slice(0,10);
    const yrs = META.data && META.data.atp ? META.data.atp.seasons.join('–') : '';
    $('#warn').innerHTML = `<div class="muted" style="margin-left:auto;font-size:12px">
      ${yrs} · built ${when}</div>`;
  }

  if(META.data_ready === false){
    $('#view').innerHTML = `<div class="card">
      <h2>No data on this instance</h2>
      <p class="muted">The build did not produce the processed tables, so there is
        nothing to rank or predict from. Nothing is being shown rather than an
        empty table that could be mistaken for a result.</p>
      <h3>To fix</h3>
      <p class="muted">Locally: <code>python fetch_data.py</code> then
        <code>python run_engine.py --build</code>.<br>
        On Railway: redeploy — the build step regenerates the data.</p>
      <p class="muted">Source: ${META.source||'unknown'}</p></div>`;
    document.querySelectorAll('nav a').forEach(a=>a.style.display='none');
    return;
  }
  route();
})();
</script>
