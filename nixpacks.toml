# Nixpacks build customisation.
#
# The data is built AT BUILD TIME, not committed and not seeded from a volume.
#
# Why: the machine this project is developed on sits behind a proxy that 404s
# raw.githubusercontent.com, so the real Sackmann archive cannot be fetched
# locally. Railway's build container has unrestricted internet, so the build is
# the natural place to pull it. The image therefore ships with real ATP/WTA data
# and every redeploy refreshes it, which is also why there is no Railway Volume
# here — unlike the NFL engine, nothing on this server mutates data at runtime,
# so there is no state worth persisting across deploys.
#
# FETCH_SEASONS controls the range (Railway service variable). More history means
# better-converged Elo and a longer build; 2005-2026 is the sweet spot at roughly
# 4-6 minutes. Match data exists back to 1968, serve/return stats from ~1991.
[phases.build]
dependsOn = ["install"]
cmds = [
  "python fetch_data.py --seasons ${FETCH_SEASONS:-2005-2026}",
  "python run_engine.py --build",
  "python tools/build_report.py",
]
